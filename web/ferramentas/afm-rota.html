<!-- AgroBasis · Calculadora de Frete Mínimo ANTT · bloco "distância pela rota" (inserido antes da grade de campos).
     Municípios: dados/geo/municipios.json (IBGE). Rota: OSRM (dados OpenStreetMap). Sem rota: linha reta x 1,25, avisando. -->
<div class="afm-rota" id="afmRota">
  <div class="afm-rota-tit">Calcular a distância pela rota <span>opcional</span></div>
  <div class="afm-rota-grid">
    <div class="afm-rota-campo"><label for="afmOrigem">Cidade de origem</label>
      <input type="text" id="afmOrigem" autocomplete="off" placeholder="Digite a cidade, ex.: Santa Rosa"><div class="afm-rota-sug" id="afmOrigemSug"></div></div>
    <div class="afm-rota-campo"><label for="afmDestino">Cidade de destino</label>
      <input type="text" id="afmDestino" autocomplete="off" placeholder="Ex.: Rio Grande"><div class="afm-rota-sug" id="afmDestinoSug"></div></div>
    <button type="button" class="afm-rota-btn" id="afmRotaBtn">Buscar km</button>
  </div>
  <div class="afm-rota-res" id="afmRotaRes"></div>
</div>
<style>
.afm-rota{background:#F4F8F2;border:1px solid #DCE8D5;border-radius:14px;padding:14px 16px;margin:0 0 16px}
.afm-rota-tit{font-weight:700;color:#1E4812;font-size:15px;margin-bottom:10px}
.afm-rota-tit span{font-weight:500;color:#6b756d;font-size:12px;margin-left:6px}
.afm-rota-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.afm-rota-campo{position:relative;display:flex;flex-direction:column;gap:5px}
.afm-rota-campo label{font-size:13px;font-weight:600;color:#3b443e}
.afm-rota-campo input{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #CFD8D1;border-radius:10px;background:#fff;color:#1d2420;width:100%;box-sizing:border-box}
.afm-rota-campo input:focus{outline:2px solid #54931B;outline-offset:0;border-color:#54931B}
.afm-rota-sug{position:absolute;top:100%;left:0;right:0;z-index:30;background:#fff;border:1px solid #CFD8D1;border-radius:10px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-height:280px;overflow:auto;display:none}
.afm-rota-sug div{padding:9px 12px;cursor:pointer;font-size:14px;color:#1d2420}
.afm-rota-sug div b{font-weight:700}
.afm-rota-sug div small{color:#6b756d;margin-left:6px}
.afm-rota-sug div:hover,.afm-rota-sug div.ativo{background:#EEF4EA}
.afm-rota-btn{font:inherit;font-weight:700;font-size:15px;color:#fff;background:#1E4812;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;white-space:nowrap}
.afm-rota-btn:hover{background:#2c5f1c}
.afm-rota-btn[disabled]{opacity:.6;cursor:wait}
.afm-rota-res{font-size:14px;color:#3b443e;margin-top:10px;min-height:0}
.afm-rota-res b{color:#1E4812}
.afm-rota-res .aviso{color:#9C5B24}
.afm-rota-res a{color:#1E4812}
@media (max-width:640px){.afm-rota-grid{grid-template-columns:1fr}.afm-rota-btn{width:100%}}
</style>
<script>
(function () {
  "use strict";
  var FONTES = ["https://raw.githubusercontent.com/lucas-jesse/agrobasis-spread-milho/main/dados/geo/municipios.json",
                "https://cdn.jsdelivr.net/gh/lucas-jesse/agrobasis-spread-milho@main/dados/geo/municipios.json"];
  var MUN = null, carregando = null, escolha = { afmOrigem: null, afmDestino: null };
  var $ = function (id) { return document.getElementById(id); };
  function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
  function carregar(i) {
    i = i || 0;
    if (MUN) return Promise.resolve(MUN);
    if (carregando && !i) return carregando;
    var p = fetch(FONTES[i]).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      MUN = d.municipios.map(function (m) { return { n: m[0], uf: m[1], lat: m[2], lon: m[3], k: norm(m[0]) }; });
      return MUN;
    }).catch(function () { if (i + 1 < FONTES.length) return carregar(i + 1); throw new Error("sem lista"); });
    if (!i) carregando = p;
    return p;
  }
  function buscar(txt) {
    var q = norm(txt.replace(/\s*[-(/].*$/, "")), uf = (txt.match(/(?:\(|-)\s*([A-Za-z]{2})\)?\s*$/) || [])[1];
    if (q.length < 2) return [];
    var ini = [], meio = [];
    for (var i = 0; i < MUN.length; i++) {
      var m = MUN[i];
      if (uf && m.uf !== uf.toUpperCase()) continue;
      if (m.k.indexOf(q) === 0) ini.push(m); else if (m.k.indexOf(q) > 0) meio.push(m);
      if (ini.length >= 8) break;
    }
    return ini.concat(meio).slice(0, 8);
  }
  function rotulo(m) { return m.n + " (" + m.uf + ")"; }
  function ligar(id) {
    var inp = $(id), caixa = $(id + "Sug"), lista = [], ativo = -1;
    function fechar() { caixa.style.display = "none"; ativo = -1; }
    function escolher(m) { escolha[id] = m; inp.value = rotulo(m); fechar(); }
    function mostrar() {
      caixa.innerHTML = lista.map(function (m, i) { return '<div data-i="' + i + '"' + (i === ativo ? ' class="ativo"' : "") + "><b>" + m.n + "</b><small>" + m.uf + "</small></div>"; }).join("");
      caixa.style.display = lista.length ? "block" : "none";
    }
    inp.addEventListener("focus", function () { carregar().catch(function () {}); });
    inp.addEventListener("input", function () {
      escolha[id] = null;
      carregar().then(function () { lista = buscar(inp.value); ativo = -1; mostrar(); }).catch(function () {});
    });
    inp.addEventListener("keydown", function (e) {
      if (caixa.style.display !== "block") return;
      if (e.key === "ArrowDown") { ativo = Math.min(lista.length - 1, ativo + 1); mostrar(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { ativo = Math.max(0, ativo - 1); mostrar(); e.preventDefault(); }
      else if (e.key === "Enter") { if (lista[ativo < 0 ? 0 : ativo]) escolher(lista[ativo < 0 ? 0 : ativo]); e.preventDefault(); }
      else if (e.key === "Escape") fechar();
    });
    caixa.addEventListener("mousedown", function (e) { var d = e.target.closest("[data-i]"); if (d) { escolher(lista[+d.dataset.i]); e.preventDefault(); } });
    inp.addEventListener("blur", function () { setTimeout(fechar, 150); });
  }
  function resolver(id) {
    if (escolha[id]) return escolha[id];
    var r = MUN ? buscar($(id).value) : [];
    return r.length ? r[0] : null;
  }
  function retaKm(a, b) {
    var R = 6371, rad = Math.PI / 180, dLa = (b.lat - a.lat) * rad, dLo = (b.lon - a.lon) * rad;
    var h = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function aplicar(km) {
    $("afmKm").value = km;
    var ret = $("afmRetorno"), dr = $("afmDistRetorno");
    if (ret && ret.checked && dr) dr.value = km;
    ["input", "change"].forEach(function (ev) { $("afmKm").dispatchEvent(new Event(ev, { bubbles: true })); });
    if (typeof window.afmCalcular === "function") { try { window.afmCalcular(); } catch (e) {} }
  }
  function calcularRota() {
    var res = $("afmRotaRes"), btn = $("afmRotaBtn");
    carregar().then(function () {
      var a = resolver("afmOrigem"), b = resolver("afmDestino");
      if (!a || !b) { res.innerHTML = '<span class="aviso">Escolha a cidade de origem e a de destino na lista de sugestões.</span>'; return; }
      $("afmOrigem").value = rotulo(a); $("afmDestino").value = rotulo(b); escolha.afmOrigem = a; escolha.afmDestino = b;
      btn.disabled = true; res.textContent = "Calculando a rota…";
      var mapa = "https://www.google.com/maps/dir/" + a.lat + "," + a.lon + "/" + b.lat + "," + b.lon;
      var url = "https://router.project-osrm.org/route/v1/driving/" + a.lon + "," + a.lat + ";" + b.lon + "," + b.lat + "?overview=false";
      var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
      fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.json(); }).then(function (d) {
        clearTimeout(t);
        if (!d.routes || !d.routes.length) throw 0;
        var km = Math.round(d.routes[0].distance / 1000), h = d.routes[0].duration / 3600;
        aplicar(km);
        res.innerHTML = "<b>" + km.toLocaleString("pt-BR") + " km</b> pela estrada entre " + rotulo(a) + " e " + rotulo(b) +
          " (cerca de " + Math.round(h) + " h de viagem). O valor foi lançado em Km. rodado e pode ser ajustado. " +
          '<a href="' + mapa + '" target="_blank" rel="noopener">Conferir a rota no mapa</a>';
      }).catch(function () {
        clearTimeout(t);
        var km = Math.round(retaKm(a, b) * 1.25 / 10) * 10;
        aplicar(km);
        res.innerHTML = '<span class="aviso">Não foi possível consultar a rota agora. Usamos uma estimativa de <b>' + km.toLocaleString("pt-BR") +
          " km</b> (distância em linha reta x 1,25).</span> Confira a distância real e ajuste o campo Km. rodado. " +
          '<a href="' + mapa + '" target="_blank" rel="noopener">Ver rota no mapa</a>';
      }).then(function () { btn.disabled = false; });
    }).catch(function () { res.innerHTML = '<span class="aviso">Não foi possível carregar a lista de cidades. Digite a distância em Km. rodado.</span>'; });
  }
  function iniciar() {
    if (!$("afmOrigem")) return;
    ligar("afmOrigem"); ligar("afmDestino");
    $("afmRotaBtn").addEventListener("click", calcularRota);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar); else iniciar();
})();
</script>
