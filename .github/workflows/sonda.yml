name: Sonda temporaria de fontes
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python sonda/sonda.py
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
