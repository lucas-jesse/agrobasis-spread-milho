name: Exporta câmbio e juros (Curva do Dólar)

on:
  schedule:
    # 12:47 e 19:07 de Brasília nos dias úteis (meio do pregão e depois do fechamento)
    - cron: '47 15 * * 1-5'
    - cron: '7 22 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - exporta_cambio.py
      - .github/workflows/exporta_cambio.yml

permissions:
  contents: write

concurrency:
  group: commit-dados
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Coletar
        run: python exporta_cambio.py
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/cambio.json dados/cambio_curvas.json
          git diff --staged --quiet || (git commit -m "Atualiza câmbio e juros" && git pull --rebase origin main && git push)
