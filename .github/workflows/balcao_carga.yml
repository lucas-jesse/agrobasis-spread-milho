name: Basis de balcão (carga avulsa)
on:
  workflow_dispatch:
    inputs:
      u:
        description: "endereço"
        required: true
jobs:
  carga:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Carga
        env:
          FONTE_BALCAO_SR: ${{ inputs.u }}
        run: python basis_balcao.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/basis
          git diff --cached --quiet || (git commit -m "Basis de balcão: carga do histórico" && git pull --rebase && git push)
