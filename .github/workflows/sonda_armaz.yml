name: sonda armaz
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_armaz.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-armaz, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for t in 5459 5470 254 255; do curl -sS -m 90 "https://apisidra.ibge.gov.br/values/t/$t/n3/all/v/all/p/last%202" -o "sidra$t.json" -w "sidra$t %{http_code} %{size_download}\n" >> status.txt || true; done
          curl -sS -m 90 "https://apisidra.ibge.gov.br/values/t/5470/n1/all/v/all/p/all" -o "s5470br.json" -w "s5470br %{http_code} %{size_download}\n" >> status.txt || true
          cat status.txt
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-armaz
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-armaz
