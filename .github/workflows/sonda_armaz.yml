name: sonda armaz
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_armaz.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-armaz, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          P=https://portaldeinformacoes.conab.gov.br
          curl -sSL -A "$UA" "$P/main-YAMX5B7E.js" -o main.js -w "main %{http_code} %{size_download}\n" >> status.txt || true
          grep -oE 'chunk-[A-Z0-9]+\.js' main.js | sort -u > chunks.txt || true
          for c in $(cat chunks.txt); do curl -sSL -A "$UA" "$P/$c" >> todos.js; done
          cat main.js >> todos.js
          grep -oE '[A-Za-z0-9_]+\.(txt|csv|xlsx|zip)' todos.js | sort -u > arquivos.txt || true
          grep -oiE '.{60}armazen.{80}' todos.js | head -40 > armaz_ctx.txt || true
          for t in 255 256 257 1749 6952 6954; do curl -sS -m 40 "https://apisidra.ibge.gov.br/values/t/$t/n1/all/v/all/p/last%201" -o "sidra$t.json" -w "sidra$t %{http_code} %{size_download}\n" >> status.txt || true; done
          cat status.txt arquivos.txt
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-armaz
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-armaz
