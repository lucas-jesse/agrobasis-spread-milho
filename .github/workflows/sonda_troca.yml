name: sonda troca
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_troca.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-troca, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -X POST https://api-comexstat.mdic.gov.br/general -H 'Content-Type: application/json' \
            -d '{"flow":"import","monthDetail":false,"period":{"from":"2025-01","to":"2025-12"},"filters":[{"filter":"heading","values":["3102","3103","3104","3105"]}],"details":["ncm"],"metrics":["metricFOB","metricKG","metricCIF"]}' -o ncms.json -w "ncms %{http_code}\n" >> status.txt || true
          curl -sS -X POST https://api-comexstat.mdic.gov.br/general -H 'Content-Type: application/json' \
            -d '{"flow":"import","monthDetail":true,"period":{"from":"2010-01","to":"2026-12"},"filters":[{"filter":"ncm","values":["31021010","31042010","31054000"]}],"details":["ncm"],"metrics":["metricKG","metricCIF"]}' -o serie.json -w "serie %{http_code} %{size_download} %{time_total}\n" >> status.txt || true
          cat status.txt
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-troca
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-troca
