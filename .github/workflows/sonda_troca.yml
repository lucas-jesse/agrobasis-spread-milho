name: sonda troca
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_troca.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-troca, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in "soja.aspx?id=92" "soja.aspx?id=12" "milho.aspx?id=77" "trigo.aspx?id=178"; do
            n=$(echo $u | tr '?=' '__'); curl -sSL -A "$UA" -e "https://www.cepea.org.br/br/indicador/soja.aspx" "https://www.cepea.org.br/br/indicador/series/$u" -o "cepea_$n" -w "$u %{http_code} %{size_download} %{content_type}\n" >> status.txt || true
          done
          file cepea_* >> status.txt; cat status.txt
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-troca
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-troca
