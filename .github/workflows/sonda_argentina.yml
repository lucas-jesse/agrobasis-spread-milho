name: Sonda Argentina
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pdfplumber
      - run: python argentina/sonda.py
      - uses: actions/upload-artifact@v4
        with:
          name: sonda
          path: argentina/sonda/
