name: Sonda Argentina
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pdfplumber
      - run: python argentina/sonda.py
      - name: Publicar no ramo sonda-argentina
        run: |
          git config user.name "AgroBasis Bot"; git config user.email "bot@agrobasis.com.br"
          git checkout -q --orphan sonda-argentina
          git rm -rq --cached . 
          git add -f argentina/sonda
          git commit -qm "sonda $(date +%F_%H%M)"
          git push -qf origin sonda-argentina
