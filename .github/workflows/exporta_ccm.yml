name: Exporta histórico CCM (dashboard HTML)

on:
  # roda logo depois da atualização diária do spread (que grava a planilha)
  workflow_run:
    workflows: ["Atualiza Spread Milho"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - exporta_historico_ccm.py
      - .github/workflows/exporta_ccm.yml

permissions:
  contents: write

concurrency:
  group: commit-dados
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Exportar histórico
        run: python exporta_historico_ccm.py
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/ccm_historico.json
          git diff --staged --quiet || git commit -m "Atualiza histórico CCM"
          git pull --rebase origin main
          git push
