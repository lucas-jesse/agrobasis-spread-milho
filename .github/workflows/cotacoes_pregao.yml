name: Cotações durante o pregão

on:
  schedule:
    # a cada 30 min, das 9h às 18h30 de Brasília (12:00 a 21:30 UTC), nos dias úteis
    - cron: '7,37 12-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotacoes-pregao
  cancel-in-progress: true

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Coletar cotações
        run: python fechamento/coleta_fechamento.py --agora
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/cotacoes_agora.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Cotações do pregão $(TZ=America/Sao_Paulo date +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
