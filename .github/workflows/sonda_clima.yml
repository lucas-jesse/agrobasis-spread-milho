name: sonda clima
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_clima.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-clima, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          C=https://www.cpc.ncep.noaa.gov
          for u in data/indices/RONI.ascii.txt data/indices/oni.ascii.txt data/indices/wksst9120.for data/indices/rel_mthsst9120.txt products/analysis_monitoring/enso_advisory/ensodisc.shtml products/analysis_monitoring/enso/roni/probabilities/ products/analysis_monitoring/enso/roni/probabilities/index.php; do
            n=$(echo $u | tr '/' '_'); curl -sSL -A "$UA" "$C/$u" -o "cpc_$n" -w "$u %{http_code} %{size_download}\n" >> status.txt || true
          done
          grep -oE 'href="[^"]+\.(csv|txt|json|png)"' cpc_products_analysis_monitoring_enso_roni_probabilities_ | head -20 >> status.txt || true
          curl -sS "https://archive-api.open-meteo.com/v1/archive?latitude=-12.55&longitude=-55.72&start_date=1991-01-01&end_date=2026-11-10&daily=precipitation_sum&timezone=America%2FSao_Paulo" -o om_arch.json -w "om_arch %{http_code} %{size_download} %{time_total}\n" >> status.txt || true
          curl -sS "https://api.open-meteo.com/v1/forecast?latitude=-12.55&longitude=-55.72&daily=precipitation_sum,temperature_2m_max&forecast_days=16&models=ecmwf_ifs025,gfs_seamless&timezone=America%2FSao_Paulo" -o om_fc.json -w "om_fc %{http_code} %{size_download}\n" >> status.txt || true
          curl -sS "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=-12.55&longitude=-55.72&daily=precipitation_sum&forecast_days=15&models=ecmwf_ifs025&timezone=America%2FSao_Paulo" -o om_ens.json -w "om_ens %{http_code} %{size_download}\n" >> status.txt || true
          curl -sS "https://seasonal-api.open-meteo.com/v1/seasonal?latitude=-12.55&longitude=-55.72&daily=precipitation_sum&forecast_days=180" -o om_seas.json -w "om_seas %{http_code} %{size_download}\n" >> status.txt || true
          cat status.txt
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-clima
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-clima
