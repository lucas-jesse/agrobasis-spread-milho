name: Atualiza Spread Milho

on:
  schedule:
    - cron: '37 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar atualização
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python atualiza_spread_milho.py

      - name: Commit da curva pública
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          if [ -f dados/curva_ccm.json ]; then
            git add dados/curva_ccm.json
            git diff --staged --quiet || git commit -m "Atualiza curva CCM"
            git push
          else
            echo "curva_ccm.json não foi gerado nesta execução, pulando commit."
          fi
