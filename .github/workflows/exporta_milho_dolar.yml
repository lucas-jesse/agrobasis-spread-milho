name: Exporta Milho B3 x Dólar

on:
  schedule:
    # depois do câmbio (19h07) e do histórico do milho B3: dias úteis às 19h41 de Brasília
    - cron: '41 22 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - exporta_milho_dolar.py
      - .github/workflows/exporta_milho_dolar.yml

permissions:
  contents: write

concurrency:
  group: commit-dados
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy websocket-client
      - name: Exportar
        run: python exporta_milho_dolar.py
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/milho_dolar.json
          git diff --staged --quiet && exit 0
          git commit -m "Milho B3 x Dólar $(TZ=America/Sao_Paulo date +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
