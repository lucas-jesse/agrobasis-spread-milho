name: Teste fontes de preço
on:
  push:
    paths: [teste_precos.py, .github/workflows/teste_precos.yml]
permissions:
  contents: write
concurrency:
  group: commit-dados
  cancel-in-progress: false
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python teste_precos.py
      - run: |
          git config user.name "AgroBasis Bot"; git config user.email "bot@agrobasis.com.br"
          git add dados/cot/_teste_precos.json && git commit -m "teste fontes" && git pull --rebase origin main && git push
