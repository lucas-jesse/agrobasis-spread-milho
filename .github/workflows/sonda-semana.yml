name: sonda-semana
on: push
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: lucas-jesse/agrobasis-spread-milho, ref: main, path: repo}
      - run: pip install requests python-calamine openpyxl
      - run: |
          cd repo && python3 - <<'PY'
          import json, exporta_troca as t
          out={}
          for k,u in [("soja","https://www.cepea.org.br/br/indicador/series/soja.aspx?id=92"),("milho","https://www.cepea.org.br/br/indicador/series/milho.aspx?id=77")]:
              d=t.tentar(t.cepea,u); out[k]=[(str(a),b,c) for a,b,c in d[-12:]]
          json.dump(out,open("../cepea.json","w"),indent=1); print(out)
          PY
      - run: git config user.name bot && git config user.email bot@x && git add cepea.json && git commit -m r && git push origin HEAD:sonda-semana
