name: Exporta vendas semanais de exportação dos EUA (USDA FAS)

on:
  schedule:
    # O USDA publica às quintas, 8h30 de Washington (10h30 de Brasília; 9h30 no horário de verão dos EUA).
    # Quinta 14h17 UTC e sexta 14h17 UTC (atraso de feriado ou falha da API).
    - cron: '17 14 * * 4'
    - cron: '17 14 * * 5'
  workflow_dispatch:
    inputs:
      max_consultas:
        description: 'Máximo de consultas à API nesta execução'
        default: '60'

permissions:
  contents: write

concurrency:
  group: export-sales
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    # com a DEMO_KEY (10 consultas por hora) a primeira carga do histórico leva cerca de 3 horas
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Baixar, agregar e salvar em lotes
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          # Com a DEMO_KEY (cerca de 10 consultas por hora) a carga do histórico é feita em lotes;
          # cada lote é salvo no repositório, então uma falha não perde o que já foi baixado.
          LOTE=${{ github.event.inputs.max_consultas || '60' }}
          [ -z "$FAS_API_KEY" ] && LOTE=9
          for i in 1 2 3 4 5; do
            python exporta_export_sales.py --max-consultas $LOTE || echo "lote $i com erro"
            git add dados/export_sales
            git diff --staged --quiet || git commit -q -m "Vendas de exportação dos EUA (USDA FAS), lote $i"
            git pull -q --rebase origin main && git push -q
            if python -c "import json,sys; sys.exit(0 if json.load(open('dados/export_sales/resumo.json'))['pendentes'] else 1)"; then
              echo "faltam anos: aguardando a próxima janela da API"; sleep 3300
            else
              echo "carga completa"; break
            fi
          done
