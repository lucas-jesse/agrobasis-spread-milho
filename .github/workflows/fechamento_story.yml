name: Story de fechamento de mercado

on:
  schedule:
    # 21:40 e 22:15 UTC = 18:40 e 19:15 de Brasília, depois do fechamento da CBOT, da B3 e do câmbio.
    # Duas execuções porque o agendador do GitHub pode atrasar; a segunda sobrescreve o card do mesmo dia.
    - cron: '40 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-dados
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - name: Coletar fechamento
        run: python fechamento/coleta_fechamento.py
      - name: Gerar story
        run: |
          if [ "$(cat fechamento/.gerar)" = "1" ]; then python fechamento/card_story.py; else echo "sem pregão: nada a gerar"; fi
          # guarda só os últimos 30 dias de cards
          ls -1 fechamento/saida/*.png 2>/dev/null | sort | head -n -30 | xargs -r git rm -q
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/fechamento.json fechamento/saida fechamento/ultimo.png
          git diff --staged --quiet || git commit -m "Story de fechamento $(date -u +%F)"
          git pull --rebase origin main
          git push
