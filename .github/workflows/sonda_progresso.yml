name: sonda progresso
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda_progresso.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    concurrency: {group: sonda-progresso, cancel-in-progress: true}
    steps:
      - name: baixar
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B=https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/safras/progresso-de-safra
          curl -sSL -A "$UA" "$B" -o indice.html || true
          curl -sSL -A "$UA" "$B/folder_contents" -o folder.html || true
          grep -oE 'href="[^"]+"' indice.html | sed 's/href="//;s/"$//' | sort -u > links_indice.txt || true
          # últimas pastas semanais
          grep -oE "$B/[a-z0-9-]+" indice.html | sort -u > pastas.txt || true
          head -3 pastas.txt | while read P; do
            n=$(basename "$P"); curl -sSL -A "$UA" "$P" -o "pasta_$n.html" || true
            grep -oE 'href="[^"]+"' "pasta_$n.html" | sed 's/href="//;s/"$//' | grep -iE 'xls|csv|pdf|download|@@' | sort -u > "links_$n.txt" || true
            for f in $(grep -iE '\.(xlsx?|csv)' "links_$n.txt" | head -6); do curl -sSL -A "$UA" "$f" -o "$n-$(basename "${f%%/@@*}")" || true; done
          done
          # portal de informações
          curl -sSL -A "$UA" https://portaldeinformacoes.conab.gov.br/downloads/arquivos/ -o portal_arquivos.html || true
          for f in ProgressoSafra.txt ProgressoDeSafra.txt ProgressoSafraGraos.txt AcompanhamentoProgressoSafra.txt; do
            curl -sSL -A "$UA" -o "portal_$f" -w "$f %{http_code} %{size_download}\n" https://portaldeinformacoes.conab.gov.br/downloads/arquivos/$f >> portal_status.txt || true
          done
          curl -sSL -A "$UA" https://portaldeinformacoes.conab.gov.br/download-arquivos.html -o portal_downloads.html || true
          ls -la
      - name: publicar
        run: |
          cd out && git init -q && git checkout -q -b sonda-progresso
          git -c user.name=bot -c user.email=bot@x add -A && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} sonda-progresso
