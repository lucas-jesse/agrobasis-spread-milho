name: Exporta relação entre culturas (CBOT)

on:
  schedule:
    # dias úteis às 19h23 de Brasília, depois do fechamento de Chicago
    - cron: '23 22 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - exporta_interculturas.py
      - .github/workflows/exporta_interculturas.yml

permissions:
  contents: write

concurrency:
  group: commit-dados
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy websocket-client
      - name: Exportar
        run: python exporta_interculturas.py
      - name: Commit
        run: |
          git config user.name "AgroBasis Bot"
          git config user.email "bot@agrobasis.com.br"
          git add dados/interculturas.json
          git diff --staged --quiet && exit 0
          git commit -m "Relação entre culturas $(TZ=America/Sao_Paulo date +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
