name: Sonda FAS (temporário)
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.fas.usda.gov/api/esr/regions?api_key=DEMO_KEY" \
                   "https://api.fas.usda.gov/api/esr/datareleasedates?api_key=DEMO_KEY" \
                   "https://apps.fas.usda.gov/OpenData/api/esr/regions" \
                   "https://apps.fas.usda.gov/export-sales/h801.htm" \
                   "https://apps.fas.usda.gov/export-sales/esrd1.html" \
                   "https://apps.fas.usda.gov/export-sales/highlite.htm" \
                   "https://www.fas.usda.gov/programs/export-sales-reporting-program"; do
            echo "=== $u"; curl -sS -m 30 -A "Mozilla/5.0" -o r.txt -w "HTTP %{http_code} %{size_download}\n" "$u"; head -c 600 r.txt | tr '\n' ' '; echo; done
