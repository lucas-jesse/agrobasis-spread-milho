name: Sonda FAS (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=DEMO_KEY; B=https://api.fas.usda.gov/api/esr
          mkdir out
          curl -sS -m 60 "$B/commodities?api_key=$K" -o out/commodities.json
          curl -sS -m 60 "$B/countries?api_key=$K" -o out/countries.json
          curl -sS -m 60 "$B/unitsOfMeasure?api_key=$K" -o out/units.json
          curl -sS -m 60 "$B/datareleasedates?api_key=$K" -o out/release.json
          curl -sS -m 120 "$B/exports/commodityCode/801/allCountries/marketYear/2026?api_key=$K" -o out/soja_2026.json
          curl -sS -m 120 "$B/exports/commodityCode/801/allCountries/marketYear/2027?api_key=$K" -o out/soja_2027.json -D out/h.txt
          ls -la out; cat out/h.txt | grep -i ratelimit
      - run: |
          cd out && git init -q -b sonda-fas && git config user.name bot && git config user.email bot@x
          git add . && git commit -qm sonda && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-fas
